[project]
name = "weasyprint-server"
version = "0.0.1"
description = "html to pdf server"
readme = "README.md"
requires-python = "==3.12.4"

dependencies = [
  "weasyprint",
  "flask",
  "sentry-sdk",
  "pyuwsgi",
]

[tool.uv]
# Borne basse : la version épinglée dans package_scripts/Dockerfile et dans
# les workflows GitHub (0.11.22), avec laquelle tournent le build du .deb et
# la CI. Pas de borne haute : si un uv plus récent régénérait un uv.lock
# que 0.11.22 ne sait plus parser (erreur cryptique « SourceWire »), la CI
# le détecterait avant le build du paquet.
required-version = ">=0.11.22"

[dependency-groups]
dev = [
    "ruff>=0.6.2",
    "python-dotenv>=1.0.1",
    "pytest>=9.0.2",
]
